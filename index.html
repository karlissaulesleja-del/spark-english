<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark — English for Kids</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2ECC8F;
    --green-dark: #1FA870;
    --green-light: #E8FBF3;
    --yellow: #FFD166;
    --yellow-dark: #F5B700;
    --coral: #FF6B6B;
    --blue: #4ECDC4;
    --purple: #A78BFA;
    --bg: #F0FDF8;
    --card: #FFFFFF;
    --text: #1A2E25;
    --text-soft: #5A7A6A;
    --border: #C8EDDA;
    --shadow: 0 4px 24px rgba(46,204,143,0.10);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    position: relative;
    overflow-x: hidden;
  }

  /* Decorative background blobs */
  body::before {
    content: '';
    position: fixed;
    top: -120px; right: -120px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, #A7F3D0 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -100px;
    width: 350px; height: 350px;
    background: radial-gradient(circle, #FDE68A 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    padding: 20px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--green), var(--blue));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(46,204,143,0.3);
  }

  .logo-name {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .logo-name span { color: var(--green); }

  .points-badge {
    background: var(--yellow);
    border-radius: 20px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: #7A5000;
    box-shadow: 0 2px 8px rgba(255,209,102,0.4);
    transition: transform .2s;
  }

  .points-badge.bump {
    animation: bump .3s ease;
  }

  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* Spark avatar area */
  .spark-area {
    padding: 8px 20px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .spark-avatar {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #A7F3D0, #6EE7B7);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 4px 16px rgba(46,204,143,0.25);
    flex-shrink: 0;
    position: relative;
  }

  .spark-avatar.speaking::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 3px solid var(--green);
    animation: pulse-ring 1s ease-out infinite;
  }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }

  .spark-info .spark-name {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 17px;
    color: var(--text);
  }

  .spark-info .spark-status {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .spark-info .spark-status.active { color: var(--green-dark); font-weight: 600; }

  /* Messages */
  .messages-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages-wrap::-webkit-scrollbar { width: 4px; }
  .messages-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
    animation: fadeUp .3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.ai { align-self: flex-start; }
  .msg.child { align-self: flex-end; }

  .bubble {
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.6;
    position: relative;
  }

  .msg.ai .bubble {
    background: var(--card);
    color: var(--text);
    border: 1.5px solid var(--border);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow);
  }

  .msg.child .bubble {
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: white;
    border-bottom-right-radius: 6px;
    box-shadow: 0 4px 16px rgba(46,204,143,0.3);
  }

  .correction-box {
    background: #FFFBEB;
    border: 1.5px solid var(--yellow-dark);
    border-radius: 10px;
    padding: 8px 12px;
    margin-top: 8px;
    font-size: 13px;
    color: #7A5000;
  }

  .correction-box strong { color: #5A3800; }

  .msg-time {
    font-size: 10px;
    color: var(--text-soft);
    margin-top: 4px;
    padding: 0 4px;
  }

  .msg.child .msg-time { text-align: right; }

  .speak-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    border-radius: 6px;
    transition: transform .15s;
    vertical-align: middle;
    margin-left: 4px;
  }
  .speak-btn:hover { transform: scale(1.2); }

  /* Typing indicator */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    border-bottom-left-radius: 6px;
    width: fit-content;
    box-shadow: var(--shadow);
  }

  .typing-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: bounce 1.2s ease infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: .2s; }
  .typing-dot:nth-child(3) { animation-delay: .4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  /* Input area */
  .input-area {
    padding: 12px 16px 24px;
    background: white;
    border-top: 1.5px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-wrap {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color .2s;
  }

  .input-wrap:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(46,204,143,0.15);
  }

  .input-wrap textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    resize: none;
    max-height: 80px;
    line-height: 1.5;
  }

  .input-wrap textarea::placeholder { color: #9ABCAD; }

  .send-btn {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(46,204,143,0.35);
    transition: transform .15s, box-shadow .15s;
    flex-shrink: 0;
  }

  .send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 16px rgba(46,204,143,0.45); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Points popup */
  .points-popup {
    position: fixed;
    top: 80px;
    right: 20px;
    background: var(--yellow);
    color: #7A5000;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    padding: 8px 16px;
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(255,209,102,0.5);
    z-index: 100;
    animation: popIn .4s ease, popOut .4s ease 1.6s forwards;
    pointer-events: none;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes popOut {
    to { opacity: 0; transform: translateY(-10px); }
  }

  /* API key setup screen */
  .setup-screen {
    position: fixed;
    inset: 0;
    background: rgba(240,253,248,0.97);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    backdrop-filter: blur(8px);
  }

  .setup-card {
    background: white;
    border-radius: 28px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(46,204,143,0.15);
    border: 1.5px solid var(--border);
    text-align: center;
  }

  .setup-icon { font-size: 52px; margin-bottom: 16px; }

  .setup-card h2 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--text);
    margin-bottom: 8px;
  }

  .setup-card p {
    font-size: 14px;
    color: var(--text-soft);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .setup-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    margin-bottom: 14px;
    transition: border-color .2s;
  }

  .setup-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(46,204,143,0.15);
  }

  .setup-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(46,204,143,0.35);
    transition: transform .15s;
  }

  .setup-btn:hover { transform: scale(1.02); }

  .setup-note {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 12px;
  }

  .setup-note a { color: var(--green-dark); }
</style>
</head>
<body>

<!-- Setup screen -->
<div class="setup-screen" id="setupScreen">
  <div class="setup-card">
    <div class="setup-icon">🔑</div>
    <h2>Welcome to Spark!</h2>
    <p>Enter your Anthropic API key to start learning English with Spark. Get your key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>
    <input class="setup-input" type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." />
    <button class="setup-btn" onclick="startApp()">Let's go! 🚀</button>
    <p class="setup-note">Your key is stored only in your browser. Never shared.</p>
  </div>
</div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-name"><span>Spark</span> English</div>
    </div>
    <div class="points-badge" id="pointsBadge">⭐ <span id="pointsCount">0</span></div>
  </div>

  <!-- Spark avatar -->
  <div class="spark-area">
    <div class="spark-avatar" id="sparkAvatar">🦊</div>
    <div class="spark-info">
      <div class="spark-name">Spark</div>
      <div class="spark-status active" id="sparkStatus">Ready to learn! 🎉</div>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-wrap" id="messagesWrap"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="msgInput" placeholder="Type in English..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  let apiKey = '';
  let points = 0;
  let conversationHistory = [];
  let isSpeaking = false;
  let currentUtterance = null;

  const SYSTEM_PROMPT = `You are Spark, a super friendly English teacher for children aged 6–10. You are warm, encouraging, and playful like a best friend.

PERSONALITY:
- Always enthusiastic and positive — never boring or critical
- Use simple words, max 2-3 short sentences per reply
- Add 1 fun question at the end of every message to keep conversation going
- Use emojis naturally (1-2 per message max)
- Celebrate effort, not just correctness

CORRECTIONS (very important!):
- Correct maximum 1 grammar mistake per message — the most important one
- NEVER say "wrong", "incorrect", "mistake" — say "small tip!" or "almost perfect!"  
- Always show the correct version clearly like: ✅ "I went to the park"
- Then immediately move on positively — never dwell on errors

POINTS system — award points by including [+10 points] in your reply when:
- Child uses a new grammar structure correctly
- Child writes a complete sentence without errors
- Child tries hard even if imperfect

TOPICS: Animals, family, school, food, hobbies, weather, colors, numbers, daily routines.
Always connect to what the child already shared about their life.

LANGUAGE: English only. If child writes in another language, gently say: "Let's try in English! How do you say...?" and give a hint.

Keep it fun, keep it short, keep it encouraging!`;

  function startApp() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key.startsWith('sk-')) {
      alert('Please enter a valid API key (starts with sk-)');
      return;
    }
    apiKey = key;
    document.getElementById('setupScreen').style.display = 'none';
    addMessage('ai', "Hey! I'm Spark! 🦊 I'm so happy to meet you! What's your name? 😊");
  }

  function addMessage(role, text, withSpeakBtn = false) {
    const wrap = document.getElementById('messagesWrap');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const time = new Date().toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit' });

    // Parse correction boxes
    let displayText = text;
    let correctionHtml = '';
    const corrMatch = text.match(/✅\s*"([^"]+)"/);
    if (corrMatch) {
      displayText = text.replace(/✅\s*"[^"]+"/g, '').trim();
      correctionHtml = `<div class="correction-box">✅ <strong>${corrMatch[1]}</strong></div>`;
    }

    // Parse points
    const pointsMatch = text.match(/\[(\+\d+) points?\]/i);
    if (pointsMatch && role === 'ai') {
      const pts = parseInt(pointsMatch[1]);
      displayText = displayText.replace(/\[\+\d+ points?\]/gi, '').trim();
      setTimeout(() => awardPoints(pts), 400);
    }

    const speakBtnHtml = (role === 'ai' && withSpeakBtn)
      ? `<button class="speak-btn" onclick="speakText(this, \`${displayText.replace(/`/g, "'")}\`)" title="Listen">🔊</button>`
      : '';

    div.innerHTML = `
      <div class="bubble">
        ${displayText}${speakBtnHtml}
        ${correctionHtml}
      </div>
      <div class="msg-time">${time}</div>
    `;

    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;

    conversationHistory.push({ role: role === 'ai' ? 'assistant' : 'user', content: text });

    if (role === 'ai') {
      setTimeout(() => speakAuto(displayText.replace(/[🦊🎉⭐😊🐾🌟💪🎮🌈]/gu, '')), 300);
    }
  }

  function showTyping() {
    const wrap = document.getElementById('messagesWrap');
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typingIndicator';
    div.innerHTML = `<div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !apiKey) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('sparkStatus').textContent = 'Thinking... 🤔';
    document.getElementById('sparkStatus').className = 'spark-status';

    addMessage('child', text);
    showTyping();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 300,
          system: SYSTEM_PROMPT,
          messages: conversationHistory.filter(m => m.role !== 'assistant' || conversationHistory.indexOf(m) > conversationHistory.length - 10)
        })
      });

      const data = await response.json();
      hideTyping();

      if (data.content && data.content[0]) {
        const reply = data.content[0].text;
        addMessage('ai', reply, true);
      } else {
        addMessage('ai', "Oops! Something went wrong. Try again! 😊");
      }
    } catch (err) {
      hideTyping();
      addMessage('ai', "Connection problem! Check your internet and try again. 🌐");
    }

    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sparkStatus').textContent = 'Ready to learn! 🎉';
    document.getElementById('sparkStatus').className = 'spark-status active';
  }

  function speakAuto(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    utter.pitch = 1.1;

    const avatar = document.getElementById('sparkAvatar');
    avatar.classList.add('speaking');
    utter.onend = () => avatar.classList.remove('speaking');

    // Try to find a child/female voice
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google US English') || v.lang === 'en-US');
    if (preferred) utter.voice = preferred;

    window.speechSynthesis.speak(utter);
  }

  function speakText(btn, text) {
    speakAuto(text);
  }

  function awardPoints(pts) {
    points += pts;
    document.getElementById('pointsCount').textContent = points;
    const badge = document.getElementById('pointsBadge');
    badge.classList.remove('bump');
    void badge.offsetWidth;
    badge.classList.add('bump');

    const popup = document.createElement('div');
    popup.className = 'points-popup';
    popup.textContent = `+${pts} points! ⭐`;
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 2100);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 80) + 'px';
  }

  // Load voices
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
